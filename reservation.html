<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - L'Aragosta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Restaurant L'Aragosta</h1>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="menu.html">Menu</a>
        <a href="reservation.html">Réservation</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <h2>Réservez votre table</h2>
    <p>Remplissez le formulaire ci-dessous pour demander une réservation.</p>

    <form action="#" method="post">

        <label for="nom">Nom complet :</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required>

        <label for="telephone">Téléphone :</label>
        <input type="tel" id="telephone" name="telephone">

        <label for="date">Date de réservation :</label>
        <input type="date" id="date" name="date" required>

        <label for="heure">Heure :</label>
        <input type="time" id="heure" name="heure" required>

        <label for="personnes">Nombre de personnes :</label>
        <input type="number" id="personnes" name="personnes"
               min="1" max="20" required>

        <label for="message">Remarque :</label>
        <textarea id="message" name="message" rows="4"
                  placeholder="Écrivez votre remarque ici..."></textarea>

        <button type="submit">Envoyer la réservation</button>

    </form>

    <p>Vous avez une question ?
        <a href="contact.html">Contactez-nous</a>.
    </p>
</main>

<footer>
    <p>&copy; 2026 Restaurant L'Aragosta - Tous droits réservés.</p>
</footer>

</body>
</html>
